name: claimsflow tests

on:
  push:
    paths: ["claimsflow/**", ".github/workflows/claimsflow-tests.yml"]
  pull_request:
    paths: ["claimsflow/**", ".github/workflows/claimsflow-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: claimsflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Smoke test
        run: python smoke_test.py
      - name: Run tests in claimsflow/tests (passes while the folder is still empty)
        run: |
          set +e
          python -m pytest -q tests
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests yet - add some to claimsflow/tests/ and this job starts doing real work."
            exit 0
          fi
          exit "$code"
